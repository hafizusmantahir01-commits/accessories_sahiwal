name: accessories_sahiwal
description: Private stock, sales, purchase-cost and profit management for Accessories Sahiwal.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.17.1
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  intl: ^0.20.2
  decimal: ^3.2.6
  image_picker: ^1.2.3
  uuid: ^4.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo_foreground.png"
  min_sdk_android: 21